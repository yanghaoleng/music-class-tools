server {
    listen 80;
    listen [::]:80;
    server_name m.mikeywa.site;
    location /.well-known/acme-challenge/ { root /var/www/notetype-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name m.mikeywa.site;
    ssl_certificate /etc/letsencrypt/live/m.mikeywa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.mikeywa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = / { return 302 /notetype/; }
    location = /notetype { return 301 /notetype/; }
    location /notetype/ {
        client_max_body_size 82m;
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }
    location / { return 404; }
}
