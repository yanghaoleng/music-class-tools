    location = /xianji { return 301 /xianji/; }
    location /xianji/ {
        alias /opt/xianji/current/dist/;
        index index.html;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
    }
